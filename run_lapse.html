<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZOKASTATION - Lapse Exploit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Black+Ops+One&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
  :root { --neon-orange: #ff5e00; --neon-purple: #9d00ff; --dark-bg: rgba(10, 5, 15, 0.85); }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh; background: #000 url('bg.jpg') no-repeat center center fixed; background-size: cover;
    color: #fff; font-family: 'Cairo', sans-serif; display: flex; align-items: center; justify-content: center; direction: rtl; overflow: hidden;
  }
  body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(157, 0, 255, 0.1) 0%, rgba(0,0,0,0.9) 100%); z-index: 0; }

  .hud-container {
    position: relative; z-index: 1; width: 95%; max-width: 850px; background: var(--dark-bg);
    border: 2px solid var(--neon-purple); border-radius: 20px; padding: 40px 30px;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 25px rgba(157, 0, 255, 0.2);
  }
  .hud-container::before { content: ''; position: absolute; top: -2px; left: 10%; width: 80%; height: 4px; background: var(--neon-orange); box-shadow: 0 0 15px var(--neon-orange); border-radius: 5px; }
  .hud-container::after { content: ''; position: absolute; bottom: -2px; left: 10%; width: 80%; height: 4px; background: var(--neon-orange); box-shadow: 0 0 15px var(--neon-orange); border-radius: 5px; }

  .brand-title { font-family: 'Black Ops One', 'Orbitron', cursive; font-size: 3.5rem; text-align: center; color: #fff; letter-spacing: 4px; margin-bottom: 5px; text-transform: uppercase; direction: ltr; text-shadow: 3px 3px 0px var(--neon-purple), -2px -2px 0px var(--neon-orange); }
  .brand-title span { color: var(--primary-red); }
  .brand-sub { font-size: 1.2rem; text-align: center; color: #fff; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 25px; direction: ltr; }

  .status-panel { background: rgba(0, 0, 0, 0.7); padding: 20px; border-radius: 10px; border: 1px solid rgba(157, 0, 255, 0.4); margin-bottom: 15px; position: relative; box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8); }

  #state { font-size: 24px; font-weight: 900; color: var(--neon-orange); text-align: center; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255, 94, 0, 0.5); }
  
  .loader-wrapper { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .dot { width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff; animation: bounce 1s infinite alternate; }
  .dot:nth-child(2) { animation-delay: 0.2s; background: var(--neon-orange); box-shadow: 0 0 10px var(--neon-orange); } .dot:nth-child(3) { animation-delay: 0.4s; background: var(--neon-purple); box-shadow: 0 0 10px var(--neon-purple); }
  @keyframes bounce { to { transform: translateY(-10px); opacity: 0.5; } }

  #out { white-space: pre-wrap; font: 12px/1.45 Consolas, monospace; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 94, 0, 0.2); border-radius: 8px; padding: 15px; min-height: 150px; max-height: 200px; overflow-y: auto; color: #e0e0e0; direction: ltr; text-align: left; }
  #out::-webkit-scrollbar { width: 5px; } #out::-webkit-scrollbar-thumb { background: var(--neon-orange); border-radius: 5px; }

  .powered-by { position: fixed; bottom: 15px; right: 25px; font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.4); z-index: 10; direction: ltr; }
  .powered-by span { color: var(--neon-orange); font-weight: 900; text-shadow: 0 0 8px var(--neon-orange); }
  .footer-sys { position: fixed; bottom: 15px; left: 25px; font-family: 'Orbitron', sans-serif; font-size: 13px; color: rgba(255,255,255,0.3); letter-spacing: 2px; z-index: 10; direction: ltr; }

  @media (max-width: 600px) { .brand-title { font-size: 2.5rem; } .hud-container { padding: 30px 15px; } .powered-by { font-size: 11px; right: 10px; } .footer-sys { font-size: 10px; left: 10px; } }
</style>
</head>
<body>

<div class="hud-container">
  <h1 class="brand-title">ZOKA<span>STATION</span></h1>
  <div class="brand-sub">LAPSE EXPLOIT</div>

  <div class="status-panel">
    <div id="state">
      <span id="stateText">⏳ جارٍ تحميل سلسلة Lapse...</span>
      <div class="loader-wrapper">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>
  </div>
  
  <div id="out"></div>
</div>

<div class="powered-by">POWERED BY <span>MAHMOUD FATHY</span></div>
<div class="footer-sys">ZOKASTATION OS v5.0</div>

<script type="module">
  import "./chain_lapse.js";
</script>
</body>
</html>
